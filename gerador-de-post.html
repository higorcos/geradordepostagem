<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gerador de post — reportagens</title>
<style>
  :root{
    --bg:#1c1c1c; --panel:#262626; --border:#3a3a3a; --text:#f2f2f0; --muted:#a3a29c; --accent:#d97757;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh; padding:20px 16px 60px;
  }
  h1{font-size:18px; font-weight:600; margin:0 0 4px;}
  p.sub{color:var(--muted); font-size:13px; margin:0 0 20px;}
  .wrap{max-width:480px; margin:0 auto;}
  .panel{background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:18px; margin-bottom:16px;}
  label{display:block; font-size:12px; color:var(--muted); margin-bottom:6px; font-weight:600; letter-spacing:.02em;}
  input[type="file"]{width:100%; font-size:13px; color:var(--text); max-width:100%;}
  textarea{
    width:100%; min-height:64px; resize:vertical; background:#1a1a1a; color:var(--text);
    border:1px solid var(--border); border-radius:8px; padding:10px 12px; font-size:14px; font-family:inherit;
  }
  select, input[type="range"]{width:100%;}
  .row{display:flex; gap:12px; flex-wrap:wrap;}
  .row > div{flex:1; min-width:120px;}
  .field{margin-bottom:14px;}
  .field:last-child{margin-bottom:0;}
  .colorline{display:flex; align-items:center; gap:10px;}
  input[type="color"]{width:36px; height:36px; border:none; border-radius:6px; background:none; padding:0; flex-shrink:0;}
  .preview-panel{position:static;}
  canvas{
    display:block; width:100%; height:auto; max-width:100%; border-radius:10px; background:#000;
    border:1px solid var(--border);
  }
  button{
    width:100%; padding:13px; border-radius:10px; border:none; font-size:15px; font-weight:600;
    cursor:pointer; margin-top:6px;
  }
  #download{background:var(--accent); color:#fff;}
  #download:disabled{opacity:.4; cursor:not-allowed;}
  .hint{font-size:12px; color:var(--muted); margin-top:8px; line-height:1.5;}
  select{background:#1a1a1a; color:var(--text); border:1px solid var(--border); border-radius:8px; padding:9px 10px; font-size:13px; max-width:100%;}

  /* wider screens: two columns, controls on the left, sticky preview on the right */
  @media (min-width: 860px){
    .wrap{max-width:960px; display:grid; grid-template-columns:380px 1fr; gap:20px; align-items:start;}
    .wrap > h1, .wrap > p.sub{grid-column:1 / -1;}
    .controls-panel{grid-column:1;}
    .preview-panel{grid-column:2; position:sticky; top:20px;}
  }

  @media (min-width: 1200px){
    .wrap{max-width:1080px; grid-template-columns:400px 1fr;}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Gerador de post de reportagem</h1>
  <p class="sub">Suba a foto, escreva a manchete e baixe a imagem pronta no seu estilo.</p>

  <div class="panel controls-panel">
    <div class="field">
      <label>Foto</label>
      <input type="file" id="photo" accept="image/*">
    </div>
    <div class="field">
      <label>Manchete</label>
      <textarea id="headline" placeholder="Ex: Imperatriz ultrapassa R$ 105 milhões em arrecadação de impostos municipais em 2026">O santinho mal chegou e já recebeu o destino final!</textarea>
    </div>
    <div class="row">
      <div class="field">
        <label>Posição da caixa</label>
        <select id="position">
          <option value="bottom">Embaixo</option>
          <option value="middle">No meio</option>
          <option value="top">Em cima</option>
        </select>
      </div>
      <div class="field">
        <label>Formato</label>
        <select id="ratio">
          <option value="1080x1350">Feed (4:5)</option>
          <option value="1080x1920" selected>Stories/Reels (9:16)</option>
          <option value="1080x1080">Quadrado (1:1)</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label>Cor do texto</label>
        <div class="colorline">
          <input type="color" id="textColor" value="#000000">
        </div>
      </div>
      <div class="field">
        <label>Cor da caixa</label>
        <div class="colorline">
          <input type="color" id="boxColor" value="#ffffff">
        </div>
      </div>
    </div>
    <div class="field">
      <label>Tamanho do texto <span id="scaleValue" style="color:var(--text); font-weight:400;">64px</span></label>
      <div style="display:flex; gap:8px; align-items:center;">
        <input type="range" id="textScale" min="14" max="110" value="64" step="1" style="flex:1;">
        <button type="button" id="autoSize" style="width:auto; margin:0; padding:8px 12px; font-size:12px;">Auto</button>
      </div>
    </div>
    <div class="field">
      <label>Opacidade do fundo <span id="opacityValue" style="color:var(--text); font-weight:400;">100%</span></label>
      <input type="range" id="boxOpacity" min="0" max="100" value="100" step="1">
    </div>
    <div class="field">
      <label>Largura da caixa <span id="widthValue" style="color:var(--text); font-weight:400;">88%</span></label>
      <input type="range" id="boxWidthPct" min="30" max="100" value="88" step="1">
    </div>
    <div class="field">
      <label>Espaçamento interno <span id="paddingValue" style="color:var(--text); font-weight:400;">100%</span></label>
      <input type="range" id="boxPadding" min="30" max="180" value="100" step="5">
    </div>
  </div>

  <div class="panel preview-panel">
    <canvas id="canvas"></canvas>
    <button id="download">Baixar imagem</button>
    <p class="hint">O texto se ajusta automaticamente ao tamanho da caixa. Troque a posição para "Em cima" ou "No meio" se a foto tiver o assunto principal na parte de baixo.</p>
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let img = null;

const photoInput = document.getElementById('photo');
const headlineInput = document.getElementById('headline');
const positionSelect = document.getElementById('position');
const ratioSelect = document.getElementById('ratio');
const textColorInput = document.getElementById('textColor');
const boxColorInput = document.getElementById('boxColor');
const textScaleInput = document.getElementById('textScale');
const scaleValueLabel = document.getElementById('scaleValue');
const autoSizeBtn = document.getElementById('autoSize');
const boxOpacityInput = document.getElementById('boxOpacity');
const opacityValueLabel = document.getElementById('opacityValue');
const boxPaddingInput = document.getElementById('boxPadding');
const paddingValueLabel = document.getElementById('paddingValue');
const boxWidthInput = document.getElementById('boxWidthPct');
const widthValueLabel = document.getElementById('widthValue');
const downloadBtn = document.getElementById('download');

function hexToRgba(hex, alphaPct){
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return `rgba(${r}, ${g}, ${b}, ${alphaPct/100})`;
}

function applyAutoSize(){
  const {w,h} = getDims();
  const boxWidth = w * (Number(boxWidthInput.value) / 100);
  const padding = w * 0.045 * (Number(boxPaddingInput.value) / 100);
  const headline = headlineInput.value.trim();
  if(!headline) return;
  const size = autoFontSize(headline, boxWidth - padding*2, h*0.4 - padding*2);
  textScaleInput.value = size;
  scaleValueLabel.textContent = size + 'px';
}

function getDims(){
  const [w,h] = ratioSelect.value.split('x').map(Number);
  return {w,h};
}

function wrapText(text, maxWidth, fontWeight, fontFamily){
  const words = text.split(' ');
  let lines = [];
  let line = '';
  for(let word of words){
    const test = line ? line + ' ' + word : word;
    if(ctx.measureText(test).width > maxWidth && line){
      lines.push(line);
      line = word;
    } else {
      line = test;
    }
  }
  if(line) lines.push(line);
  return lines;
}

function autoFontSize(text, maxWidth, maxHeight){
  let fontSize = 64;
  const minFontSize = 14;
  while(fontSize > minFontSize){
    ctx.font = `800 ${fontSize}px -apple-system, "Segoe UI", Roboto, sans-serif`;
    const lines = wrapText(text, maxWidth, 800);
    const lineHeight = fontSize * 1.18;
    if(lines.length * lineHeight <= maxHeight) break;
    fontSize -= 2;
  }
  return fontSize;
}

function layoutAtFontSize(text, fontSize, maxWidth){
  ctx.font = `800 ${fontSize}px -apple-system, "Segoe UI", Roboto, sans-serif`;
  const lines = wrapText(text, maxWidth, 800);
  const lineHeight = fontSize * 1.18;
  return {fontSize, lines, lineHeight};
}

function draw(){
  const {w,h} = getDims();
  canvas.width = w;
  canvas.height = h;

  ctx.fillStyle = '#111';
  ctx.fillRect(0,0,w,h);

  if(img){
    const imgRatio = img.width / img.height;
    const canvasRatio = w / h;
    let drawW, drawH, dx, dy;
    if(imgRatio > canvasRatio){
      drawH = h; drawW = h * imgRatio; dx = (w - drawW)/2; dy = 0;
    } else {
      drawW = w; drawH = w / imgRatio; dx = 0; dy = (h - drawH)/2;
    }
    ctx.drawImage(img, dx, dy, drawW, drawH);
  }

  // subtle bottom darkening gradient for legibility, like the reference posts
  const grad = ctx.createLinearGradient(0, h*0.55, 0, h);
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, h*0.55, w, h*0.45);

  const headline = headlineInput.value.trim();
  if(headline){
    const boxWidth = w * (Number(boxWidthInput.value) / 100);
    const margin = (w - boxWidth) / 2;
    const padding = w * 0.045 * (Number(boxPaddingInput.value) / 100);

    const scalePx = Number(textScaleInput.value);
    const {fontSize, lines, lineHeight} = layoutAtFontSize(headline, scalePx, boxWidth - padding*2);
    const boxHeight = lines.length * lineHeight + padding*2;

    let boxY;
    const pos = positionSelect.value;
    if(pos === 'bottom') boxY = h - boxHeight - margin;
    else if(pos === 'top') boxY = margin;
    else boxY = (h - boxHeight)/2;

    const radius = w*0.02;
    ctx.fillStyle = hexToRgba(boxColorInput.value, Number(boxOpacityInput.value));
    ctx.beginPath();
    ctx.moveTo(margin + radius, boxY);
    ctx.arcTo(margin + boxWidth, boxY, margin + boxWidth, boxY + boxHeight, radius);
    ctx.arcTo(margin + boxWidth, boxY + boxHeight, margin, boxY + boxHeight, radius);
    ctx.arcTo(margin, boxY + boxHeight, margin, boxY, radius);
    ctx.arcTo(margin, boxY, margin + boxWidth, boxY, radius);
    ctx.closePath();
    ctx.fill();

    ctx.font = `800 ${fontSize}px -apple-system, "Segoe UI", Roboto, sans-serif`;
    ctx.fillStyle = textColorInput.value;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const textStartY = boxY + boxHeight/2 - ((lines.length-1)*lineHeight)/2;
    lines.forEach((line, i) => {
      ctx.fillText(line, w/2, textStartY + i*lineHeight);
    });
  }
}

photoInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const image = new Image();
    image.onload = () => { img = image; draw(); };
    image.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

[headlineInput, positionSelect, ratioSelect, textColorInput, boxColorInput, textScaleInput, boxOpacityInput, boxPaddingInput, boxWidthInput].forEach(el => {
  el.addEventListener('input', draw);
  el.addEventListener('change', draw);
});

textScaleInput.addEventListener('input', () => {
  scaleValueLabel.textContent = textScaleInput.value + 'px';
});
boxOpacityInput.addEventListener('input', () => {
  opacityValueLabel.textContent = boxOpacityInput.value + '%';
});
boxPaddingInput.addEventListener('input', () => {
  paddingValueLabel.textContent = boxPaddingInput.value + '%';
});
boxWidthInput.addEventListener('input', () => {
  widthValueLabel.textContent = boxWidthInput.value + '%';
});
autoSizeBtn.addEventListener('click', () => {
  applyAutoSize();
  draw();
});

downloadBtn.addEventListener('click', () => {
  const link = document.createElement('a');
  link.download = 'post-reportagem.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
});

applyAutoSize();
draw();
</script>
</body>
</html>
